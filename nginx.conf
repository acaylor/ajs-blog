absolute_redirect off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Taxonomy URLs published between the April 2026 Astro migration and the slug
    # fix used the raw frontmatter string, so they carried capitals and encoded
    # spaces (/categories/Software%20Development/). 301 them to the slug form.
    #
    # These are exact-match locations rather than a `map` on purpose: nginx lowercases
    # the lookup key in `map` (ngx_hash_strlow), so a map would match the already-correct
    # /categories/ai/ against the /categories/AI/ key and redirect it to itself. `location =`
    # is case-sensitive. $uri is percent-decoded before matching, hence the literal spaces.
    #
    # This list is closed — terms added after the fix are slugified from the start.
    location = "/categories/AI/" { return 301 "/categories/ai/"; }
    location = "/categories/AI/2/" { return 301 "/categories/ai/2/"; }
    location = "/categories/Cloud/" { return 301 "/categories/cloud/"; }
    location = "/categories/Command Line/" { return 301 "/categories/command-line/"; }
    location = "/categories/Containers/" { return 301 "/categories/containers/"; }
    location = "/categories/Containers/2/" { return 301 "/categories/containers/2/"; }
    location = "/categories/Containers/3/" { return 301 "/categories/containers/3/"; }
    location = "/categories/Database Management/" { return 301 "/categories/database-management/"; }
    location = "/categories/Homelab/" { return 301 "/categories/homelab/"; }
    location = "/categories/Homelab/2/" { return 301 "/categories/homelab/2/"; }
    location = "/categories/Homelab/3/" { return 301 "/categories/homelab/3/"; }
    location = "/categories/Homelab/4/" { return 301 "/categories/homelab/4/"; }
    location = "/categories/Homelab/5/" { return 301 "/categories/homelab/5/"; }
    location = "/categories/Kubernetes/" { return 301 "/categories/kubernetes/"; }
    location = "/categories/Kubernetes/2/" { return 301 "/categories/kubernetes/2/"; }
    location = "/categories/Linux/" { return 301 "/categories/linux/"; }
    location = "/categories/Linux/2/" { return 301 "/categories/linux/2/"; }
    location = "/categories/Logging/" { return 301 "/categories/logging/"; }
    location = "/categories/Networking/" { return 301 "/categories/networking/"; }
    location = "/categories/Observability/" { return 301 "/categories/observability/"; }
    location = "/categories/Observability/2/" { return 301 "/categories/observability/2/"; }
    location = "/categories/Proxmox/" { return 301 "/categories/proxmox/"; }
    location = "/categories/Python/" { return 301 "/categories/python/"; }
    location = "/categories/Raspberry Pi/" { return 301 "/categories/raspberry-pi/"; }
    location = "/categories/Security/" { return 301 "/categories/security/"; }
    location = "/categories/Software Development/" { return 301 "/categories/software-development/"; }
    location = "/categories/Software Development/2/" { return 301 "/categories/software-development/2/"; }
    location = "/categories/Software/" { return 301 "/categories/software/"; }
    location = "/categories/Software/2/" { return 301 "/categories/software/2/"; }
    location = "/categories/Software/3/" { return 301 "/categories/software/3/"; }
    location = "/categories/Virtual Machines/" { return 301 "/categories/virtual-machines/"; }
    location = "/categories/Virtual Machines/2/" { return 301 "/categories/virtual-machines/2/"; }
    location = "/categories/Windows/" { return 301 "/categories/windows/"; }
    location = "/categories/macOS/" { return 301 "/categories/macos/"; }
    location = "/tags/AWS Amplify/" { return 301 "/tags/aws-amplify/"; }
    location = "/tags/AWS/" { return 301 "/tags/aws/"; }
    location = "/tags/GCP/" { return 301 "/tags/gcp/"; }
    location = "/tags/Gitlab CI/" { return 301 "/tags/gitlab-ci/"; }
    location = "/tags/Gitlab/" { return 301 "/tags/gitlab/"; }
    location = "/tags/Hugo/" { return 301 "/tags/hugo/"; }
    location = "/tags/IPAM/" { return 301 "/tags/ipam/"; }
    location = "/tags/Kanboard/" { return 301 "/tags/kanboard/"; }
    location = "/tags/claude code/" { return 301 "/tags/claude-code/"; }
    location = "/tags/configuration management/" { return 301 "/tags/configuration-management/"; }
    location = "/tags/developer tools/" { return 301 "/tags/developer-tools/"; }
    location = "/tags/developer tools/2/" { return 301 "/tags/developer-tools/2/"; }
    location = "/tags/file conversion/" { return 301 "/tags/file-conversion/"; }
    location = "/tags/fluent bit/" { return 301 "/tags/fluent-bit/"; }
    location = "/tags/frontend design/" { return 301 "/tags/frontend-design/"; }
    location = "/tags/google cloud/" { return 301 "/tags/google-cloud/"; }
    location = "/tags/grafana alloy/" { return 301 "/tags/grafana-alloy/"; }
    location = "/tags/grafana mimir/" { return 301 "/tags/grafana-mimir/"; }
    location = "/tags/home assistant/" { return 301 "/tags/home-assistant/"; }
    location = "/tags/infrastructure as code/" { return 301 "/tags/infrastructure-as-code/"; }
    location = "/tags/macOS setup/" { return 301 "/tags/macos-setup/"; }
    location = "/tags/macOS/" { return 301 "/tags/macos/"; }
    location = "/tags/mx linux/" { return 301 "/tags/mx-linux/"; }
    location = "/tags/nginx proxy manager/" { return 301 "/tags/nginx-proxy-manager/"; }
    location = "/tags/open source/" { return 301 "/tags/open-source/"; }
    location = "/tags/openEBS/" { return 301 "/tags/openebs/"; }
    location = "/tags/raspberry pi/" { return 301 "/tags/raspberry-pi/"; }
    location = "/tags/reverse proxy/" { return 301 "/tags/reverse-proxy/"; }
    location = "/tags/search engine/" { return 301 "/tags/search-engine/"; }
    location = "/tags/stable diffusion/" { return 301 "/tags/stable-diffusion/"; }
    location = "/tags/uptime kuma/" { return 301 "/tags/uptime-kuma/"; }
    location = "/tags/virtual machine/" { return 301 "/tags/virtual-machine/"; }
    location = "/tags/visual studio code/" { return 301 "/tags/visual-studio-code/"; }
    location = "/tags/vm template/" { return 301 "/tags/vm-template/"; }
    location = "/tags/windows terminal/" { return 301 "/tags/windows-terminal/"; }

    # --- Terms retired from frontmatter (June 2026 metadata cleanup) ---------
    # These slugs were live under Hugo and were indexed. The cleanup commit
    # dropped or respelled the term, orphaning the URL. Point each at the
    # surviving term rather than letting it 404.
    location = "/tags/development-tools/" { return 301 "/tags/developer-tools/"; }
    location = "/tags/postgresql/" { return 301 "/tags/postgres/"; }
    location = "/tags/windows-10/" { return 301 "/tags/windows/"; }
    location = "/categories/rasperry-pi/" { return 301 "/categories/raspberry-pi/"; }
    location = "/categories/windows-10/" { return 301 "/categories/windows/"; }

    # Hugo's :contentbasename kept the filename's case; Astro lowercases the
    # collection id. This is the one post URL the migration silently changed.
    location = "/posts/ReaR-linux-backup/" { return 301 "/posts/rear-linux-backup/"; }

    # --- Hugo-era URL compatibility (migration was April 2026) ---------------
    # Search engines still hold URLs from the Hugo site. Tag and category paths
    # are handled in the app (see src/utils/slug.ts, which reproduces Hugo's
    # slug rules), but these two shapes have no Astro equivalent and 404'd.

    # Hugo paginated at /page/N with pagerSize 6; Astro uses /N with pageSize 12,
    # so page numbers do not map. Send them to the section root rather than to a
    # wrong page of results.
    location ~ ^(/posts|/tags/[^/]+|/categories/[^/]+)/page/[0-9]+/?$ {
        return 301 $1/;
    }

    # The home page paginated too, at the bare /page/N.
    location ~ ^/page/[0-9]+/?$ {
        return 301 /;
    }

    # Hugo emitted a feed per section and per taxonomy term, plus one for each
    # taxonomy root (/tags/index.xml). Astro ships one.
    location ~ ^(/|/posts/|/tags/|/categories/|/tags/[^/]+/|/categories/[^/]+/)index\.xml$ {
        return 301 /rss.xml;
    }

    # Hugo's sitemap filename. Astro's sitemap integration emits an index instead.
    location = "/sitemap.xml" { return 301 "/sitemap-index.xml"; }

    # Hugo had an /archive/ section listing every post; Astro's equivalent is /posts/.
    location = "/archive/" { return 301 "/posts/"; }
    location = "/archive/index.xml" { return 301 "/rss.xml"; }

    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
