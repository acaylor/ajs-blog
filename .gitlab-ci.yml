---
stages:
  - test
  - build

variables:
  TARGET_PLATFORMS: linux/amd64

lint:
  stage: test
  image: node:26-alpine
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - node_modules/
  script:
    - corepack enable
    - pnpm install --frozen-lockfile
    - pnpm run lint
    - pnpm run check
    - pnpm run format:check

build_and_verify:
  stage: test
  image: node:26-alpine
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - node_modules/
  script:
    - corepack enable
    - pnpm install --frozen-lockfile
    - pnpm run build
    # static a11y / HTML structure check on the rendered output
    - pnpm run a11y
    # every amplify-redirects.json target must still be a page we build
    - pnpm run check:redirects
    # internal links must not cost a redirect hop (missing trailing slash, or a
    # link to a known amplify-redirects.json source instead of its target)
    - pnpm run check:links
    # internal link integrity (lychee is a Rust binary; fetch the musl build
    # in this job to avoid installing the dependencies a second time)
    - wget -qO- https://github.com/lycheeverse/lychee/releases/latest/download/lychee-x86_64-unknown-linux-musl.tar.gz | tar xz --strip-components=1 lychee-x86_64-unknown-linux-musl/lychee
    - ./lychee --offline --root-dir "$CI_PROJECT_DIR/dist" --config lychee.toml 'dist/**/*.html'
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

buildTesting:
  stage: build
  image:
    name: moby/buildkit:rootless
    entrypoint: ['']
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  before_script:
    - mkdir -p ~/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > ~/.docker/config.json
  script:
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context="$CI_PROJECT_DIR" \
        --local dockerfile="$CI_PROJECT_DIR" \
        --opt platform="$TARGET_PLATFORMS" \
        --output type=image,name=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA,push=true
  rules:
    - if: '$CI_COMMIT_BRANCH == "testing"'

buildProduction:
  stage: build
  image:
    name: moby/buildkit:rootless
    entrypoint: ['']
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  before_script:
    - mkdir -p ~/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > ~/.docker/config.json
  script:
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context="$CI_PROJECT_DIR" \
        --local dockerfile="$CI_PROJECT_DIR" \
        --opt platform="$TARGET_PLATFORMS" \
        --output type=image,name=$CI_REGISTRY_IMAGE:latest,push=true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
