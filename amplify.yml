version: 1
frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        # Cache pnpm's content store, not node_modules: a restored node_modules
        # tree can be stale (e.g. a flat npm-era layout) and shadow the
        # lockfile's versions. Install links from the store, so a fresh
        # node_modules costs seconds.
        - rm -rf node_modules
        - pnpm install --frozen-lockfile --store-dir .pnpm-store
    build:
      commands:
        - pnpm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .pnpm-store/**/*
